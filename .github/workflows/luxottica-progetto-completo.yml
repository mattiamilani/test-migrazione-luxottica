name: luxottica-progetto-completo
on:
  workflow_dispatch:
env:
  APP_NAME: LuxotticaApp
  DEPLOY_ENV: staging
jobs:
  Checkout:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo "Scarico il codice di ${{ env.APP_NAME }}..."
    - name: checkout
      uses: actions/checkout@v4.1.0
  Build_Lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo "Compilazione in corso per ${{ env.DEPLOY_ENV }}..."
    - name: sh
      shell: bash
      run: npm install
    - name: sh
      shell: bash
      run: npm run lint
  Unit_Tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: Build_Lint
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo Esecuzione test unitari...
    - name: sh
      shell: bash
      run: npm test
  Deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: Unit_Tests
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo "Rilascio in corso su ${{ env.DEPLOY_ENV }}..."
    - name: sh
      shell: bash
      run: npm run deploy
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Checkout
    - Build_Lint
    - Unit_Tests
    - Deploy
    steps:
    - name: snapshot post build workflow status
      run: echo "success=${{ contains(needs.*.result,'success') && !contains(needs.*.result,'cancelled') && !contains(needs.*.result,'failure') }}" >> $GITHUB_OUTPUT
      id: post_build
    - name: echo message
      run: echo Pipeline completata con successo!
      if: steps.post_build.outputs.success == 'true'
    - name: echo message
      run: echo Pulizia spazio di lavoro...
      if: always()
