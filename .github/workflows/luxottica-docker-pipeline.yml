name: luxottica-docker-pipeline
on:
  workflow_dispatch:
    inputs:
      VERSION:
        required: false
        description: Versione dell'artefatto
        default: 1.0.0
env:
  DOCKER_IMAGE: luxottica-app
  REGISTRY_URL: registry.luxottica.com
jobs:
  Setup_Debug:
    name: Setup & Debug
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: 'echo "Avvio build versione: ${{ inputs.VERSION }}"'
    - name: echo message
      run: 'echo "Ambiente di esecuzione: ${{ env.NODE_NAME }}"'
    - name: sh
      shell: bash
      run: printenv
  Unit_Tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: Setup_Debug
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo Esecuzione Unit Tests...
    - name: sh
      shell: bash
      run: echo "Running unit tests..." && sleep 2
  Security_Scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: Setup_Debug
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo Esecuzione Security Scan...
    - name: sh
      shell: bash
      run: echo "Running security scan..." && sleep 2
  Docker_Build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
    - Unit_Tests
    - Security_Scan
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: 'echo "Building Docker Image: ${{ env.DOCKER_IMAGE }}:${{ inputs.VERSION }}"'
    - name: sh
      shell: bash
      run: '"echo ''docker build -t ${{ env.DOCKER_IMAGE }}:${{ inputs.VERSION }} .''"'
  Push_to_Registry:
    if:
#       # Unsupported condition(s) [expression]
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: Docker_Build
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo "Pushing to ${{ env.REGISTRY_URL }}..."
    - name: sh
      shell: bash
      run: '"echo ''docker push ${{ env.REGISTRY_URL }}/${{ env.DOCKER_IMAGE }}:${{ inputs.VERSION }}''"'
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Setup_Debug
    - Unit_Tests
    - Security_Scan
    - Docker_Build
    - Push_to_Registry
    steps:
    - name: snapshot post build workflow status
      run: |-
        echo "failure=${{ contains(needs.*.result,'failure') && !contains(needs.*.result,'cancelled') }}" >> $GITHUB_OUTPUT
        echo "success=${{ contains(needs.*.result,'success') && !contains(needs.*.result,'cancelled') && !contains(needs.*.result,'failure') }}" >> $GITHUB_OUTPUT
      id: post_build
    - name: echo message
      run: echo Invio notifica fallimento a Slack...
      if: steps.post_build.outputs.failure == 'true'
    - name: echo message
      run: echo Pipeline completata! Pronto per il monitoraggio.
      if: steps.post_build.outputs.success == 'true'
